{% extends 'base.html' %}

{% block content %}
<h2>Post About "{{ book.title }}"</h2>

<form method="POST">
    {% csrf_token %}
    <label for="caption">Add your caption:</label>
    <textarea name="caption" id="caption" rows="4" placeholder="What do you think about this book?"></textarea>
    <button type="submit">Post</button>
</form>

<a href="{{ book.infolink }}">Read more about the book</a> <!-- Link to book details if needed -->
{% endblock %}
